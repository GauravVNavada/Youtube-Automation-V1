events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend {
        server backend:8000;
    }

    upstream playground_api {
        server playground-api:8000;
    }

    server {
        listen 80;
        client_max_body_size 200m;

        location /api/playground/ {
            proxy_pass http://playground_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 900s;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 900s;
        }

        location = /playground {
            return 301 /playground/;
        }

        location /playground/ {
            alias /usr/share/nginx/html/playground/;
            try_files $uri $uri/ /playground/index.html;
        }

        location / {
            return 200 "Desktop backend is running. Open the desktop app to use the UI.\n";
            add_header Content-Type text/plain;
        }
    }
}
