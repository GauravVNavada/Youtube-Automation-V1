<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Playground</title>
    <style>
      :root {
        color-scheme: dark;
        --background: hsl(222.2 84% 4.9%);
        --foreground: hsl(210 40% 98%);
        --card: hsl(222.2 47.4% 7.5%);
        --card-foreground: hsl(210 40% 98%);
        --popover: hsl(222.2 47.4% 7.5%);
        --popover-foreground: hsl(210 40% 98%);
        --primary: hsl(164 72% 56%);
        --primary-foreground: hsl(222.2 84% 4.9%);
        --secondary: hsl(217.2 32.6% 17.5%);
        --secondary-foreground: hsl(210 40% 98%);
        --muted-bg: hsl(217.2 32.6% 13.5%);
        --muted: hsl(215 20.2% 65.1%);
        --accent-bg: hsl(217.2 32.6% 17.5%);
        --accent: hsl(164 72% 56%);
        --destructive: hsl(346.8 77.2% 59.8%);
        --destructive-foreground: hsl(210 40% 98%);
        --border: hsl(217.2 32.6% 20.5%);
        --input: hsl(217.2 32.6% 20.5%);
        --ring: hsl(164 72% 56%);
        --warning: hsl(38 92% 58%);
        --blue: hsl(221 83% 68%);
        --radius: 8px;
        --bg: var(--background);
        --panel: var(--card);
        --panel-2: var(--secondary);
        --line: var(--border);
        --text: var(--foreground);
        --amber: var(--warning);
        --rose: var(--destructive);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 40% 0%, hsl(222.2 47.4% 10.5%) 0, var(--background) 42%);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 1px solid var(--line);
        background: var(--secondary);
        color: var(--text);
        border-radius: var(--radius);
        cursor: pointer;
        transition: border-color 140ms ease, background 140ms ease, color 140ms ease, transform 140ms ease;
      }

      button:hover:not(:disabled) {
        background: hsl(217.2 32.6% 21%);
        border-color: hsl(215 20.2% 36%);
      }

      button:active:not(:disabled) {
        transform: translateY(1px);
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .ghost {
        background: transparent;
        border-color: var(--line);
        color: var(--text);
        min-height: 34px;
        padding: 6px 10px;
      }

      .app {
        display: grid;
        grid-template-columns: minmax(280px, 320px) minmax(420px, 1fr) minmax(420px, 520px);
        height: 100vh;
        overflow: hidden;
        gap: 1px;
        background: var(--border);
      }

      .sidebar,
      .chat,
      .details {
        min-width: 0;
        min-height: 0;
        border-right: 0;
      }

      .sidebar {
        background: color-mix(in srgb, var(--card) 94%, black);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow: hidden;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: 0;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
        background: var(--muted-bg);
      }

      .settings {
        display: grid;
        gap: 10px;
        flex: 0 0 auto;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: hsl(222.2 47.4% 6.2%);
        color: var(--text);
        padding: 10px;
        outline: none;
      }

      textarea {
        resize: vertical;
      }

      .music-picker {
        display: grid;
        gap: 6px;
      }

      .music-picker > label {
        display: block;
      }

      .music-upload-status {
        min-height: 18px;
        color: var(--muted);
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      .music-upload-status.selected {
        color: var(--accent);
      }

      .music-upload-status.error {
        color: var(--rose);
      }

      .runs {
        display: grid;
        align-content: start;
        gap: 8px;
        overflow: auto;
        padding-right: 2px;
        min-height: 0;
        flex: 1 1 auto;
      }

      .run-item {
        text-align: left;
        padding: 11px 12px;
        display: grid;
        gap: 5px;
        background: transparent;
        border-color: transparent;
        border-radius: var(--radius);
      }

      .run-item:hover {
        background: var(--accent-bg);
        border-color: var(--border);
      }

      .run-item strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .run-item small {
        color: var(--muted);
      }

      .chat {
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--background);
        overflow: hidden;
      }

      .topbar {
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        background: color-mix(in srgb, var(--card) 78%, transparent);
        backdrop-filter: blur(10px);
      }

      .topbar h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 650;
      }

      .status {
        text-transform: capitalize;
      }

      .status.running,
      .stage.running {
        color: var(--amber);
      }

      .status.succeeded,
      .stage.succeeded {
        color: var(--accent);
      }

      .status.failed,
      .stage.failed {
        color: var(--rose);
      }

      .thread {
        display: grid;
        align-content: start;
        gap: 14px;
        overflow: auto;
        padding: 18px;
      }

      .bubble {
        max-width: min(760px, 92%);
        padding: 12px 14px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: var(--card);
        line-height: 1.45;
        white-space: pre-wrap;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03);
      }

      .bubble.user {
        justify-self: start;
        background: var(--card);
        border-color: var(--border);
      }

      .bubble.assistant {
        justify-self: end;
        background: color-mix(in srgb, var(--primary) 15%, var(--card));
        border-color: color-mix(in srgb, var(--primary) 42%, var(--border));
      }

      .bubble small {
        display: block;
        margin-top: 8px;
        color: var(--muted);
      }

      .bubble-meta {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .thinking {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-top: 10px;
      }

      .thinking span {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--primary);
        opacity: 0.45;
        animation: thinking 1.2s infinite ease-in-out;
      }

      .thinking span:nth-child(2) {
        animation-delay: 0.16s;
      }

      .thinking span:nth-child(3) {
        animation-delay: 0.32s;
      }

      @keyframes thinking {
        0%, 80%, 100% {
          transform: translateY(0);
          opacity: 0.35;
        }
        40% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }

      .composer {
        border-top: 1px solid var(--line);
        padding: 14px;
        display: grid;
        grid-template-columns: 1fr 96px;
        gap: 10px;
      }

      .composer textarea {
        min-height: 54px;
        max-height: 140px;
      }

      .send {
        background: var(--primary);
        color: var(--primary-foreground);
        border-color: transparent;
        font-weight: 700;
      }

      .details {
        background: color-mix(in srgb, var(--card) 94%, black);
        display: grid;
        grid-template-rows: auto minmax(260px, 46vh) 1fr;
        overflow: hidden;
      }

      .details-head {
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }

      .details-head h2 {
        margin: 0 0 8px;
        font-size: 16px;
        font-weight: 650;
      }

      .graph-wrap {
        padding: 16px;
        overflow: auto;
        border-bottom: 1px solid var(--line);
      }

      .graph {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        position: relative;
      }

      .stage {
        min-height: 82px;
        text-align: left;
        padding: 12px;
        display: grid;
        grid-template-columns: 36px 1fr 34px;
        gap: 10px;
        align-items: center;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: var(--panel);
        position: relative;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03);
      }

      .stage-select {
        display: contents;
        text-align: inherit;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
      }

      .stage-select:hover:not(:disabled),
      .stage-select:active:not(:disabled) {
        background: transparent;
        transform: none;
      }

      .stage-select:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 4px;
        border-radius: var(--radius);
      }

      .node-rerun,
      .stage-rerun {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        padding: 0;
        border-radius: 999px;
        background: var(--muted-bg);
      }

      .stage-rerun {
        width: auto;
        padding: 0 12px;
        grid-auto-flow: column;
        gap: 7px;
      }

      .node-rerun svg,
      .stage-rerun svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      .node-rerun.is-busy svg,
      .stage-rerun.is-busy svg {
        animation: spin 900ms linear infinite;
      }

      .stage.selected {
        border-color: var(--blue);
        background: color-mix(in srgb, var(--blue) 10%, var(--panel));
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--blue) 48%, transparent);
      }

      .stage.running {
        border-color: var(--warning);
        background: color-mix(in srgb, var(--warning) 10%, var(--panel));
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--warning) 34%, transparent);
      }

      .stage.running::before {
        content: "";
        position: absolute;
        right: 12px;
        top: 12px;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--warning);
        box-shadow: 0 0 0 0 color-mix(in srgb, var(--warning) 40%, transparent);
        animation: pulse 1.5s ease-out infinite;
      }

      .stage.selected.running {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, var(--panel));
        box-shadow:
          0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent),
          inset 3px 0 0 var(--warning);
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--warning) 42%, transparent);
        }
        70% {
          box-shadow: 0 0 0 8px transparent;
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .stage strong {
        color: var(--text);
        font-size: 13px;
      }

      .stage small {
        color: var(--muted);
      }

      .stage::after {
        content: "";
        position: absolute;
        left: 29px;
        top: calc(100% + 1px);
        height: 12px;
        border-left: 1px solid var(--line);
      }

      .stage:last-child::after {
        display: none;
      }

      .node-index {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #101318;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .stage.running .node-index {
        color: #1d1405;
        background: var(--amber);
        border-color: transparent;
      }

      .stage.selected .node-index {
        color: hsl(222.2 84% 4.9%);
        background: var(--blue);
        border-color: transparent;
      }

      .stage.selected.running .node-index {
        color: var(--primary-foreground);
        background: var(--accent);
      }

      .stage.succeeded .node-index {
        color: #06110e;
        background: var(--accent);
        border-color: transparent;
      }

      .stage.failed .node-index {
        color: #19050a;
        background: var(--rose);
        border-color: transparent;
      }

      .stage.skipped {
        opacity: 0.72;
      }

      .stage.skipped .node-index {
        background: #242832;
        color: var(--muted);
      }

      .node-body {
        display: grid;
        gap: 5px;
        min-width: 0;
      }

      .node-body span {
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .node-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .node-badges em {
        font-style: normal;
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 7px;
        background: var(--muted-bg);
      }

      .node-badges em.loop-badge {
        color: var(--warning);
        border-color: color-mix(in srgb, var(--warning) 55%, var(--line));
        background: color-mix(in srgb, var(--warning) 12%, transparent);
      }

      .inspector {
        overflow: auto;
        padding: 16px;
        display: grid;
        gap: 12px;
        align-content: start;
      }

      .section {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .section summary {
        cursor: pointer;
        padding: 10px 12px;
        color: var(--text);
      }

      pre {
        margin: 0;
        padding: 12px;
        overflow: auto;
        max-height: 280px;
        color: hsl(210 40% 94%);
        background: hsl(222.2 47.4% 5.2%);
        border-top: 1px solid var(--line);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.45;
        font-size: 12px;
      }

      .event-list {
        display: grid;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid var(--line);
      }

      .event {
        display: grid;
        gap: 4px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: hsl(222.2 47.4% 6.2%);
      }

      .artifact-grid {
        display: grid;
        gap: 10px;
        padding: 12px;
        border-top: 1px solid var(--line);
      }

      .artifact {
        display: grid;
        gap: 8px;
      }

      .artifact img,
      .artifact video {
        width: 100%;
        max-height: 220px;
        object-fit: contain;
        border-radius: var(--radius);
        background: hsl(222.2 47.4% 4.5%);
      }

      .artifact a {
        color: var(--accent);
        overflow-wrap: anywhere;
      }

      .control-panel {
        display: grid;
        gap: 12px;
      }

      .control-card {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: var(--radius);
        padding: 12px;
        display: grid;
        gap: 10px;
      }

      .control-card h3 {
        margin: 0;
        font-size: 13px;
        font-weight: 700;
      }

      .control-card p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .control-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .control-grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .control-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .control-row button,
      .apply-rerun {
        min-height: 34px;
        padding: 7px 10px;
      }

      .control-row button.active {
        border-color: var(--accent);
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
      }

      .control-field {
        display: grid;
        gap: 6px;
      }

      .control-line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .control-line small,
      .control-value {
        color: var(--muted);
        font-size: 12px;
      }

      .control-value {
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      .control-field input[type="range"] {
        padding: 0;
        accent-color: var(--primary);
      }

      .control-field input[type="checkbox"] {
        width: auto;
      }

      .instruction-box {
        min-height: 76px;
      }

      .toggle-field {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 40px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: hsl(222.2 47.4% 6.2%);
      }

      .toggle-field span {
        color: var(--text);
        font-size: 13px;
      }

      .control-actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .apply-rerun {
        display: inline-grid;
        grid-auto-flow: column;
        place-content: center;
        align-items: center;
        gap: 8px;
        background: color-mix(in srgb, var(--primary) 18%, var(--secondary));
        border-color: color-mix(in srgb, var(--primary) 42%, var(--line));
      }

      .settings-preview {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .settings-preview span {
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 11px;
        background: var(--muted-bg);
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        background: rgba(5, 7, 10, 0.78);
        padding: 24px;
      }

      .modal.open {
        display: grid;
        place-items: center;
      }

      .modal-panel {
        width: min(1280px, 96vw);
        height: min(880px, 92vh);
        border: 1px solid var(--line);
        border-radius: calc(var(--radius) + 2px);
        background: var(--popover);
        display: grid;
        grid-template-rows: auto auto 1fr;
        overflow: hidden;
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.42);
      }

      .modal-head {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .modal-head h2 {
        margin: 0;
        font-size: 16px;
      }

      .modal-tabs {
        display: flex;
        gap: 8px;
        overflow: auto;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
      }

      .modal-tab {
        white-space: nowrap;
        min-height: 34px;
        padding: 6px 10px;
      }

      .modal-tab.active {
        border-color: var(--accent);
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
      }

      .modal-body {
        overflow: auto;
        padding: 16px;
      }

      .modal-body pre {
        max-height: none;
        min-height: 100%;
      }

      .modal-body .artifact-grid {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }

      .modal-body .artifact img,
      .modal-body .artifact video {
        max-height: 420px;
      }

      * {
        scrollbar-width: thin;
        scrollbar-color: hsl(215 20.2% 32%) transparent;
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-thumb {
        background: hsl(215 20.2% 32%);
        border: 3px solid transparent;
        border-radius: 999px;
        background-clip: padding-box;
      }

      @media (max-width: 1120px) {
        .app {
          grid-template-columns: minmax(240px, 280px) 1fr;
          grid-template-rows: minmax(520px, 1fr) minmax(520px, 70vh);
          overflow: auto;
        }

        .details {
          grid-column: 1 / -1;
          min-height: 520px;
          border-top: 1px solid var(--line);
          grid-template-rows: auto minmax(220px, 42vh) 1fr;
        }
      }

      @media (max-width: 760px) {
        .app {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(520px, 72vh) minmax(560px, 78vh);
          height: auto;
          min-height: 100vh;
          overflow: auto;
        }

        .sidebar,
        .chat,
        .details {
          border-right: 0;
        }

        .sidebar {
          max-height: 520px;
        }

        .composer {
          grid-template-columns: 1fr;
        }

        .control-grid,
        .control-grid.three {
          grid-template-columns: 1fr;
        }

        .topbar,
        .modal-head {
          align-items: flex-start;
          flex-direction: column;
        }

        .modal {
          padding: 10px;
        }

        .modal-panel {
          width: 100%;
          height: 96vh;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="brand">
          <h1>Agent Playground</h1>
          <span class="pill" id="runCount">0 runs</span>
        </div>
        <button id="newChat" type="button">New Chat</button>
        <div class="settings">
          <label>
            Genre
            <select id="genre"></select>
          </label>
          <label>
            Provider
            <select id="provider"></select>
          </label>
          <label>
            Gemini key
            <input id="apiKey" type="password" autocomplete="off" placeholder="Optional for playground" />
          </label>
          <div class="music-picker">
            <label for="musicFile">Music</label>
            <input id="musicFile" type="file" accept=".mp3,.wav,.m4a,.aac,.ogg,.flac,audio/*" />
            <span class="music-upload-status" id="musicStatus">No music selected</span>
          </div>
          <label>
            Notes
            <textarea id="notes" rows="3"></textarea>
          </label>
        </div>
        <div class="runs" id="runs"></div>
      </aside>

      <section class="chat">
        <header class="topbar">
          <div>
            <h2>Chat Run</h2>
            <span class="pill" id="activeMeta">No run selected</span>
          </div>
          <span class="pill status" id="activeStatus">idle</span>
        </header>
        <div class="thread" id="thread"></div>
        <form class="composer" id="composer">
          <textarea id="message" rows="2" placeholder="Type a video request or change..."></textarea>
          <button class="send" id="send" type="submit">Send</button>
        </form>
      </section>

      <aside class="details">
        <div class="details-head">
          <h2 id="stageTitle">Agent Graph</h2>
          <span class="pill" id="stageMeta">Click an agent</span>
        </div>
        <div class="graph-wrap">
          <div class="graph" id="graph"></div>
        </div>
        <div class="inspector" id="inspector"></div>
      </aside>
    </main>
    <div class="modal" id="stageModal" aria-hidden="true">
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-head">
          <div>
            <h2 id="modalTitle">Agent Details</h2>
            <span class="pill" id="modalMeta">No stage selected</span>
          </div>
          <button class="ghost" id="modalClose" type="button">Close</button>
        </div>
        <div class="modal-tabs" id="modalTabs"></div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <script>
      const API = "/api/playground";
      const MAX_MUSIC_UPLOAD_BYTES = 300 * 1024 * 1024;
      const terminal = new Set(["succeeded", "failed", "skipped"]);
      const state = {
        runs: [],
        currentRun: null,
        selectedStageId: "",
        selectedStage: null,
        modalTab: "artifacts",
        messages: [],
        poll: null,
        rerunningStageId: "",
        controlSettings: {},
        stageInstructions: {},
        musicUpload: null,
        musicPathOverride: null,
      };

      const DEFAULT_SETTINGS = {
        voice_speed: 1.0,
        caption_words: 4,
        image_count: 8,
        music_volume: 0.12,
        min_visual_segment_ms: 3500,
        visual_motion: true,
        transition_style: "slide",
        transition_seconds: 0.45,
        zoom_variant: "mixed",
      };

      const STAGE_OPTIONS = {
        desktop_master_agent: {
          title: "Routing",
          quick: [
            ["Route as edit", "Treat this as an edit/remake of the current video, preserving the original topic."],
            ["Keep same topic", "Preserve the original source prompt and named subject exactly."],
            ["Fresh route", "Re-evaluate the route from the beginning using the current message and settings."],
          ],
        },
        style_sampler_agent: {
          title: "Style Samples",
          quick: [
            ["More cinematic", "Generate a more cinematic style direction with stronger pacing and visual contrast."],
            ["Cleaner pacing", "Prefer cleaner pacing and fewer abrupt creative choices."],
            ["High energy", "Favor punchier samples with faster hooks and stronger retention beats."],
          ],
        },
        parameter_agent: {
          title: "Parameter Mapping",
          quick: [
            ["Use selected knobs", "Map the current playground controls into the child run settings."],
            ["Preserve upstream", "Only change the selected node and downstream artifacts."],
            ["Target this node", "Keep the repair targeted to the selected node unless downstream rebuilding is required."],
          ],
        },
        master_agent: {
          title: "Pipeline Start",
          quick: [
            ["Rebuild all", "Start the shared pipeline again while preserving genre and source prompt."],
            ["Keep duration", "Keep the current duration and avoid changing unrelated generation settings."],
            ["Strict source", "Keep the original prompt as the source of truth for the run."],
          ],
        },
        topic_discovery_agent: {
          title: "Topic Discovery",
          quick: [
            ["New angle", "Find a fresher, more specific angle for the same source topic."],
            ["Keep subject", "Do not drift away from the named subject in the original prompt."],
            ["More grounded", "Prefer concrete, grounded topic angles over generic ones."],
          ],
        },
        research_agent: {
          title: "Research",
          quick: [
            ["Refresh facts", "Refresh the research brief and use stronger concrete facts."],
            ["More sources", "Prefer better source snippets and more specific supporting details."],
            ["Tighter brief", "Keep the brief concise and directly usable by the script."],
          ],
        },
        script_agent: {
          title: "Script",
          quick: [
            ["Fresh hook", "Regenerate with a stronger first sentence and faster setup."],
            ["Simple words", "Use simpler words, clearer sentence flow, and less generic narration."],
            ["Stronger ending", "Improve the final reveal or closing point while preserving the topic."],
            ["Keep subject", "Keep the named subject and do not copy unrelated few-shot examples."],
          ],
        },
        validation_agent: {
          title: "Validation",
          quick: [
            ["Strict check", "Run stricter validation and repair anything off-topic, copied, or weak."],
            ["Preserve passed", "Preserve artifacts that already passed validation."],
            ["Repair loop", "Send focused repair notes back to the owning agent if validation fails."],
          ],
        },
        audio_agent: {
          title: "Audio",
          controls: [
            { kind: "range", key: "voice_speed", label: "Voice speed", min: 0.65, max: 1.4, step: 0.01, format: "multiplier" },
          ],
          quick: [
            ["Slower", "voice_speed", 0.88],
            ["Normal", "voice_speed", 1.0],
            ["Faster", "voice_speed", 1.12],
          ],
        },
        caption_agent: {
          title: "Captions",
          controls: [
            { kind: "range", key: "caption_words", label: "Words per caption", min: 1, max: 8, step: 1, format: "integer" },
          ],
          quick: [
            ["Tighter", "caption_words", 2],
            ["Balanced", "caption_words", 4],
            ["Longer", "caption_words", 6],
          ],
        },
        timed_visual_agent: {
          title: "Visual Timing",
          controls: [
            { kind: "range", key: "min_visual_segment_ms", label: "Min segment", min: 1200, max: 8000, step: 100, format: "milliseconds" },
          ],
          quick: [
            ["More cuts", "min_visual_segment_ms", 1800],
            ["Balanced", "min_visual_segment_ms", 3500],
            ["Slower cuts", "min_visual_segment_ms", 5200],
          ],
        },
        asset_agent: {
          title: "Assets",
          controls: [
            { kind: "range", key: "image_count", label: "Visual variety", min: 1, max: 24, step: 1, format: "integer" },
          ],
          quick: [
            ["Replace weak", "Replace weak or repeated visuals and search closer to the narration subject."],
            ["Prefer video", "Prefer stock video where it fits the timed visual cue."],
            ["Avoid repeats", "Avoid reusing selected URLs, filenames, or visually similar assets."],
          ],
        },
        music_agent: {
          title: "Music & SFX",
          controls: [
            { kind: "range", key: "music_volume", label: "Music volume", min: 0, max: 0.8, step: 0.01, format: "percent" },
          ],
          quick: [
            ["Subtle", "Keep uploaded music quiet under narration."],
            ["More present", "Raise uploaded music slightly while keeping narration clear."],
            ["Use SFX", "Keep resolved sound effects placed near their trigger words."],
          ],
        },
        render_agent: {
          title: "Render",
          controls: [
            { kind: "toggle", key: "visual_motion", label: "Animate still images" },
            { kind: "choice", key: "transition_style", label: "Transition", options: [["slide", "Slide"], ["fade", "Fade"], ["wipe", "Wipe"], ["cut", "Cut"]] },
            { kind: "range", key: "transition_seconds", label: "Transition speed", min: 0, max: 1.2, step: 0.05, format: "seconds" },
            { kind: "choice", key: "zoom_variant", label: "Zoom variant", options: [["mixed", "Mixed"], ["center_in", "Center in"], ["center_out", "Center out"], ["still", "Still"]] },
          ],
          quick: [
            ["PowerPoint", "transition_style", "slide"],
            ["Soft fade", "transition_style", "fade"],
            ["No motion", "zoom_variant", "still"],
          ],
        },
        thumbnail_agent: {
          title: "Thumbnail",
          quick: [
            ["New cover", "Regenerate the cover images from the strongest available visual."],
            ["Bolder text", "Use shorter, stronger thumbnail text."],
            ["Use first visual", "Prefer the first selected visual as the thumbnail source."],
          ],
        },
        final_output: {
          title: "Final Output",
          quick: [
            ["Refresh metadata", "Refresh final output metadata and artifact collection."],
            ["Keep files", "Keep existing media files and only recollect final artifacts."],
          ],
        },
      };

      const els = {
        genre: document.getElementById("genre"),
        provider: document.getElementById("provider"),
        apiKey: document.getElementById("apiKey"),
        musicFile: document.getElementById("musicFile"),
        musicStatus: document.getElementById("musicStatus"),
        notes: document.getElementById("notes"),
        newChat: document.getElementById("newChat"),
        runs: document.getElementById("runs"),
        runCount: document.getElementById("runCount"),
        thread: document.getElementById("thread"),
        composer: document.getElementById("composer"),
        message: document.getElementById("message"),
        send: document.getElementById("send"),
        activeMeta: document.getElementById("activeMeta"),
        activeStatus: document.getElementById("activeStatus"),
        graph: document.getElementById("graph"),
        inspector: document.getElementById("inspector"),
        stageTitle: document.getElementById("stageTitle"),
        stageMeta: document.getElementById("stageMeta"),
        stageModal: document.getElementById("stageModal"),
        modalTitle: document.getElementById("modalTitle"),
        modalMeta: document.getElementById("modalMeta"),
        modalTabs: document.getElementById("modalTabs"),
        modalBody: document.getElementById("modalBody"),
        modalClose: document.getElementById("modalClose"),
      };

      if (els.musicFile) els.musicFile.addEventListener("change", uploadSelectedMusic);

      boot();

      async function boot() {
        await Promise.all([loadGenres(), loadProviders(), loadRuns()]);
        updateMusicStatus();
        renderThread();
        renderGraph();
        renderInspector();
      }

      async function uploadSelectedMusic() {
        const file = els.musicFile && els.musicFile.files ? els.musicFile.files[0] : null;
        if (!file) {
          state.musicUpload = null;
          state.musicPathOverride = null;
          updateMusicStatus();
          renderInspector();
          return;
        }
        if (file.size > MAX_MUSIC_UPLOAD_BYTES) {
          state.musicUpload = null;
          state.musicPathOverride = "";
          state.controlSettings = { ...state.controlSettings, music_path: "" };
          if (els.musicFile) els.musicFile.value = "";
          updateMusicStatus(`Upload failed: music file is ${formatFileSize(file.size)}. Keep it under ${formatFileSize(MAX_MUSIC_UPLOAD_BYTES)}.`, true);
          renderInspector();
          return;
        }
        updateMusicStatus("Uploading...");
        const form = new FormData();
        form.append("file", file);
        try {
          const response = await fetch(`${API}/music`, {
            method: "POST",
            body: form,
          });
          if (!response.ok) {
            let message = response.statusText;
            try {
              const data = await response.json();
              message = data.detail || message;
            } catch (_error) {}
            throw new Error(message);
          }
          const data = await response.json();
          state.musicUpload = data;
          state.musicPathOverride = data.music_path || "";
          state.controlSettings = { ...state.controlSettings, music_path: state.musicPathOverride };
          updateMusicStatus();
          renderInspector();
        } catch (error) {
          state.musicUpload = null;
          state.musicPathOverride = "";
          state.controlSettings = { ...state.controlSettings, music_path: "" };
          updateMusicStatus(`Upload failed: ${error && error.message ? error.message : "Unknown error"}`, true);
          renderInspector();
        }
      }

      async function loadGenres() {
        const genres = await api("/genres");
        els.genre.innerHTML = genres.map((genre) => (
          `<option value="${escapeHtml(genre.genre_id)}">${escapeHtml(genre.display_name)}</option>`
        )).join("");
      }

      async function loadProviders() {
        const providers = await api("/llm-options");
        els.provider.innerHTML = providers.map((provider) => (
          `<option value="${escapeHtml(provider.provider)}">${escapeHtml(provider.label)}</option>`
        )).join("");
      }

      async function loadRuns() {
        state.runs = await api("/runs");
        els.runCount.textContent = `${state.runs.length} runs`;
        els.runs.innerHTML = state.runs.map((run) => (
          `<button class="run-item" data-run="${escapeHtml(run.id)}">
            <strong>${escapeHtml(run.user_message || "Untitled run")}</strong>
            <small><span class="status ${escapeHtml(run.status)}">${escapeHtml(run.status)}</span> · ${formatTime(run.created_at)}</small>
          </button>`
        )).join("");
        els.runs.querySelectorAll("[data-run]").forEach((button) => {
          button.addEventListener("click", () => openRun(button.dataset.run));
        });
      }

      els.composer.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = els.message.value.trim();
        if (!text) return;
        els.send.disabled = true;
        state.messages.push({ role: "user", content: text });
        state.messages.push({ role: "assistant", content: "Got it. I am setting up the right agents and starting the video run now.", pending: true });
        renderThread();
        try {
          const run = await api("/runs", {
            method: "POST",
            body: JSON.stringify({
              message: text,
              genre_id: els.genre.value || "scary_stories",
              notes: els.notes.value || "",
              llm_provider: els.provider.value || "env",
              llm_api_key: els.apiKey.value || "",
              music_path: selectedMusicPath(),
              parent_run_id: state.currentRun ? state.currentRun.id : "",
              chat_history: compactChatHistory(),
            }),
          });
          els.message.value = "";
          setCurrentRun(run);
          await loadRuns();
          startPolling(run.id);
        } catch (error) {
          state.messages = state.messages.filter((message) => !message.pending);
          state.messages.push({ role: "assistant", content: friendlyError(error) });
          renderThread();
        } finally {
          els.send.disabled = false;
        }
      });

      els.newChat.addEventListener("click", () => {
        if (state.poll) {
          clearInterval(state.poll);
          state.poll = null;
        }
        state.currentRun = null;
        state.selectedStageId = "";
        state.selectedStage = null;
        state.controlSettings = { ...DEFAULT_SETTINGS };
        state.stageInstructions = {};
        state.musicUpload = null;
        state.musicPathOverride = null;
        state.messages = [];
        els.message.value = "";
        if (els.musicFile) els.musicFile.value = "";
        els.activeMeta.textContent = "New chat";
        els.activeStatus.textContent = "idle";
        els.activeStatus.className = "pill status";
        updateMusicStatus();
        renderThread();
        renderGraph();
        renderInspector();
      });

      els.modalClose.addEventListener("click", closeStageModal);
      els.stageModal.addEventListener("click", (event) => {
        if (event.target === els.stageModal) closeStageModal();
      });
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeStageModal();
      });

      async function openRun(runId) {
        const run = await api(`/runs/${encodeURIComponent(runId)}`);
        state.messages = [
          { role: "user", content: run.raw_user_message || run.user_message || "" },
          { role: "assistant", content: summaryForRun(run) },
        ];
        setCurrentRun(run);
        if (!terminal.has(run.status)) startPolling(run.id);
      }

      function startPolling(runId) {
        if (state.poll) clearInterval(state.poll);
        state.poll = setInterval(async () => {
          const run = await api(`/runs/${encodeURIComponent(runId)}`);
          setCurrentRun(run);
          if (terminal.has(run.status)) {
            clearInterval(state.poll);
            state.poll = null;
            await loadRuns();
          }
        }, 1200);
      }

      function setCurrentRun(run) {
        const previousRunId = state.currentRun && state.currentRun.id;
        if (previousRunId !== run.id) {
          state.musicUpload = null;
          state.musicPathOverride = null;
          if (els.musicFile) els.musicFile.value = "";
        }
        state.currentRun = run;
        const runSettings = {
          ...((run && run.settings && typeof run.settings === "object") ? run.settings : {}),
          ...((run && run.settings_patch && typeof run.settings_patch === "object") ? run.settings_patch : {}),
        };
        state.controlSettings = previousRunId === run.id
          ? { ...DEFAULT_SETTINGS, ...runSettings, ...state.controlSettings }
          : { ...DEFAULT_SETTINGS, ...runSettings };
        const stageIds = Array.isArray(run.stages) ? run.stages.map((stage) => stage.id) : [];
        if ((!state.selectedStageId || !stageIds.includes(state.selectedStageId)) && run.stages && run.stages.length) {
          state.selectedStageId = run.stages[0].id;
          state.selectedStage = run.stages[0];
        } else if (state.selectedStageId && Array.isArray(run.stages)) {
          state.selectedStage = run.stages.find((stage) => stage.id === state.selectedStageId) || state.selectedStage;
        }
        const pendingIndex = state.messages.findIndex((message) => message.pending);
        if (pendingIndex >= 0) {
          state.messages[pendingIndex] = {
            role: "assistant",
            content: summaryForRun(run),
            pending: !terminal.has(run.status),
          };
        }
        els.activeMeta.textContent = run.route_summary || run.user_message || "Current run";
        els.activeStatus.textContent = run.status || "idle";
        els.activeStatus.className = `pill status ${run.status || ""}`;
        updateMusicStatus();
        renderThread();
        renderGraph();
        loadSelectedStage().then(() => renderInspector());
        renderInspector();
      }

      function renderThread() {
        if (!state.messages.length) {
          els.thread.innerHTML = `<div class="bubble assistant"><span class="bubble-meta">AI</span>Tell me what video you want. I will route it through the agents and keep the graph updated while I work.</div>`;
          return;
        }
        els.thread.innerHTML = state.messages.map((message) => (
          `<div class="bubble ${message.role}">
            <span class="bubble-meta">${message.role === "user" ? "You" : "AI"}</span>
            ${escapeHtml(message.content)}
            ${message.pending ? `<div class="thinking" aria-label="Working"><span></span><span></span><span></span></div>` : ""}
          </div>`
        )).join("");
        els.thread.scrollTop = els.thread.scrollHeight;
      }

      function renderGraph() {
        const run = state.currentRun;
        const stages = run && Array.isArray(run.stages) ? run.stages : [];
        els.graph.innerHTML = stages.map((stage, index) => (
          `<article class="stage ${escapeHtml(stage.status)} ${stage.id === state.selectedStageId ? "selected" : ""}">
            <button class="stage-select" type="button" data-stage="${escapeHtml(stage.id)}">
              <div class="node-index">${index + 1}</div>
              <div class="node-body">
                <strong>${escapeHtml(label(stage.agent_name || stage.id))}</strong>
                <small>${escapeHtml(stage.execution_mode || "")} · ${escapeHtml(stage.status || "queued")}</small>
                <div class="node-badges">
                  ${stage.input_json && Object.keys(stage.input_json).length ? "<em>input</em>" : ""}
                  ${stage.output_json && Object.keys(stage.output_json).length ? "<em>output</em>" : ""}
                  ${stage.artifacts && stage.artifacts.length ? `<em>${stage.artifacts.length} files</em>` : ""}
                  ${loopTargets(stage).map((target) => `<em class="loop-badge">Loop -> ${escapeHtml(label(target))}</em>`).join("")}
                </div>
                <span>${escapeHtml(stage.events && stage.events.length ? stage.events[stage.events.length - 1].message : stage.prompt_text || "")}</span>
              </div>
            </button>
            <button class="node-rerun ${state.rerunningStageId === stage.id ? "is-busy" : ""}" type="button" data-rerun-stage="${escapeHtml(stage.id)}" title="Rerun node" aria-label="Rerun ${escapeHtml(label(stage.agent_name || stage.id))}" ${state.rerunningStageId ? "disabled" : ""}>
              ${repeatIcon()}
            </button>
          </article>`
        )).join("") || `<div class="stage"><strong>No run</strong><small>Submit a message</small></div>`;
        els.graph.querySelectorAll("[data-stage]").forEach((button) => {
          button.addEventListener("click", async () => {
            state.selectedStageId = button.dataset.stage;
            await loadSelectedStage();
            renderGraph();
            renderInspector();
          });
        });
        els.graph.querySelectorAll("[data-rerun-stage]").forEach((button) => {
          button.addEventListener("click", () => rerunStage(button.dataset.rerunStage, payloadForStageId(button.dataset.rerunStage)));
        });
      }

      function loopTargets(stage) {
        const events = Array.isArray(stage && stage.events) ? stage.events : [];
        const targets = [];
        events.forEach((event) => {
          const payload = event && event.payload_json ? event.payload_json : {};
          const target = payload.loop_back_to || "";
          const message = String(event && event.message || "").toLowerCase();
          if (target && message.includes("feedback") && !targets.includes(target)) {
            targets.push(target);
          }
        });
        return targets;
      }

      async function loadSelectedStage() {
        if (!state.currentRun || !state.selectedStageId) return;
        try {
          state.selectedStage = await api(`/runs/${encodeURIComponent(state.currentRun.id)}/stages/${encodeURIComponent(state.selectedStageId)}`);
          if (Array.isArray(state.currentRun.stages)) {
            const index = state.currentRun.stages.findIndex((stage) => stage.id === state.selectedStageId);
            if (index >= 0) state.currentRun.stages[index] = state.selectedStage;
          }
        } catch (error) {
          state.selectedStage = null;
          console.warn("Could not load stage details", error);
        }
      }

      async function rerunStage(stageId, options = {}) {
        if (!state.currentRun || !stageId || state.rerunningStageId) return;
        state.rerunningStageId = stageId;
        renderGraph();
        renderInspector();
        try {
          const run = await api(`/runs/${encodeURIComponent(state.currentRun.id)}/stages/${encodeURIComponent(stageId)}/rerun`, {
            method: "POST",
            body: JSON.stringify(options || {}),
          });
          state.selectedStageId = stageId;
          state.messages.push({ role: "assistant", content: `Rerunning ${label(stageId)} as a targeted child run.`, pending: !terminal.has(run.status) });
          setCurrentRun(run);
          await loadSelectedStage();
          await loadRuns();
          startPolling(run.id);
        } catch (error) {
          state.messages.push({ role: "assistant", content: friendlyError(error) });
          renderThread();
        } finally {
          state.rerunningStageId = "";
          renderGraph();
          renderInspector();
        }
      }

      function renderInspector() {
        const run = state.currentRun;
        const stage = state.selectedStage || (run && Array.isArray(run.stages)
          ? run.stages.find((item) => item.id === state.selectedStageId) || run.stages[0]
          : null);
        if (!stage) {
          els.stageTitle.textContent = "Node Controls";
          els.stageMeta.textContent = "No stage selected";
          els.inspector.innerHTML = `<div class="control-card"><p>Select a node to test its available options.</p></div>`;
          return;
        }
        els.stageTitle.textContent = label(stage.agent_name || stage.id);
        els.stageMeta.textContent = `${stage.status || "queued"} · ${stage.execution_mode || ""}`;
        els.inspector.innerHTML = stageControlPanel(stage);
        const openButton = document.getElementById("openStageModal");
        if (openButton) openButton.addEventListener("click", openStageModal);
        const rerunButton = document.getElementById("rerunStage");
        if (rerunButton) rerunButton.addEventListener("click", () => rerunStage(stage.id, payloadFromControls(stage)));
        const plainRerunButton = document.getElementById("plainRerunStage");
        if (plainRerunButton) plainRerunButton.addEventListener("click", () => rerunStage(stage.id));
        bindControlPanel(stage);
      }

      function stageControlPanel(stage) {
        const settings = currentSettings();
        const latestEvent = stage.events && stage.events.length ? stage.events[stage.events.length - 1].message : "";
        return `<div class="control-panel" data-stage-controls="${escapeHtml(stage.id)}">
          <div class="control-card">
            <h3>${escapeHtml(label(stage.agent_name || stage.id))}</h3>
            <p>${escapeHtml(latestEvent || stage.prompt_text || "Ready for a targeted rerun.")}</p>
            ${settingsPreview(settings)}
          </div>
          ${controlsForStage(stage, settings)}
          <div class="control-card">
            <h3>Agent Note</h3>
            <textarea class="instruction-box" rows="3" data-agent-instruction placeholder="Optional instruction for this node">${escapeHtml(stageInstruction(stage.id))}</textarea>
            ${instructionButtons(stage.id)}
          </div>
          ${stage.error_text ? `<div class="control-card"><h3>Error</h3><p>${escapeHtml(stage.error_text)}</p></div>` : ""}
          <div class="control-actions">
            <button class="apply-rerun ${state.rerunningStageId === stage.id ? "is-busy" : ""}" id="rerunStage" type="button" ${state.rerunningStageId ? "disabled" : ""}>${repeatIcon()} ${state.rerunningStageId === stage.id ? "Rerunning" : "Apply & rerun from this node"}</button>
            <button class="ghost" id="plainRerunStage" type="button" ${state.rerunningStageId ? "disabled" : ""}>Rerun without changes</button>
            <button class="ghost" id="openStageModal" type="button">Open Full Details</button>
          </div>
        </div>`;
      }

      function controlsForStage(stage, settings) {
        const id = stage.id || "";
        if (id === "render_agent") return renderControls(settings);
        if (id === "audio_agent") return audioControls(settings);
        if (id === "caption_agent") return captionControls(settings);
        if (id === "asset_agent") return assetControls(settings);
        if (id === "timed_visual_agent") return visualTimingControls(settings);
        if (id === "music_agent") return musicControls(settings);
        if (id === "parameter_agent") return parameterControls(settings);
        if (id === "script_agent") return scriptControls();
        if (id === "topic_discovery_agent" || id === "research_agent") return researchControls(id);
        if (id === "thumbnail_agent") return thumbnailControls();
        if (id === "final_output") return finalOutputControls();
        return genericControls(id);
      }

      function renderControls(settings) {
        return `<div class="control-card">
          <h3>Render</h3>
          <div class="control-grid">
            <label class="toggle-field">
              <input data-setting="visual_motion" type="checkbox" ${settings.visual_motion ? "checked" : ""} />
              <span>Animate stills</span>
            </label>
            ${selectSetting("zoom_variant", "Zoom variant", [
              ["mixed", "Mixed center"],
              ["center_in", "Center zoom in"],
              ["center_out", "Center zoom out"],
              ["still", "Still"],
            ], settings.zoom_variant)}
            ${selectSetting("transition_style", "Transition", [
              ["slide", "Slide"],
              ["fade", "Fade"],
              ["wipe", "Wipe"],
              ["cut", "Cut"],
            ], settings.transition_style)}
            ${numberSetting("transition_seconds", "Transition seconds", settings.transition_seconds, "0", "1.2", "0.05")}
          </div>
          ${presetRow("transition_style", settings.transition_style, [["slide", "Slide"], ["fade", "Fade"], ["wipe", "Wipe"], ["cut", "Cut"]])}
          ${presetRow("zoom_variant", settings.zoom_variant, [["mixed", "Mixed"], ["center_in", "Zoom in"], ["center_out", "Zoom out"], ["still", "Still"]])}
        </div>`;
      }

      function musicControls(settings) {
        const musicName = settings.music_path ? `Selected: ${musicFileName(settings.music_path)}` : "No music selected";
        return `<div class="control-card">
          <h3>Music & SFX</h3>
          <p>${escapeHtml(musicName)}</p>
          <div class="control-grid">
            ${numberSetting("music_volume", "Music volume", settings.music_volume, "0", "0.8", "0.01")}
          </div>
          ${presetRow("music_volume", settings.music_volume, [["0.08", "Low"], ["0.12", "Normal"], ["0.2", "Higher"], ["0", "Mute"]])}
        </div>`;
      }

      function audioControls(settings) {
        return `<div class="control-card">
          <h3>Audio</h3>
          <div class="control-grid">
            ${numberSetting("voice_speed", "Voice speed", settings.voice_speed, "0.65", "1.4", "0.01")}
          </div>
          ${presetRow("voice_speed", settings.voice_speed, [["0.82", "Slower"], ["1", "Normal"], ["1.12", "Faster"]])}
        </div>`;
      }

      function captionControls(settings) {
        return `<div class="control-card">
          <h3>Captions</h3>
          <div class="control-grid">
            ${numberSetting("caption_words", "Words per caption", settings.caption_words, "1", "8", "1")}
          </div>
          ${presetRow("caption_words", settings.caption_words, [["2", "Tight"], ["3", "Short"], ["4", "Normal"], ["5", "Longer"]])}
        </div>`;
      }

      function assetControls(settings) {
        return `<div class="control-card">
          <h3>Assets</h3>
          <div class="control-grid">
            ${numberSetting("image_count", "Visual variety", settings.image_count, "1", "24", "1")}
          </div>
          ${presetRow("image_count", settings.image_count, [["8", "Light"], ["10", "Normal"], ["14", "More"], ["18", "Heavy"]])}
        </div>`;
      }

      function visualTimingControls(settings) {
        return `<div class="control-card">
          <h3>Visual Timing</h3>
          <div class="control-grid">
            ${numberSetting("image_count", "Target visual beats", settings.image_count, "1", "24", "1")}
            ${numberSetting("min_visual_segment_ms", "Min segment ms", settings.min_visual_segment_ms, "1200", "8000", "100")}
          </div>
          ${presetRow("image_count", settings.image_count, [["8", "Balanced"], ["12", "Quicker"], ["16", "Dense"]])}
          ${presetRow("min_visual_segment_ms", settings.min_visual_segment_ms, [["2500", "Fast"], ["3500", "Normal"], ["5000", "Slow"]])}
        </div>`;
      }

      function parameterControls(settings) {
        return `<div class="control-card">
          <h3>Parameters</h3>
          <div class="control-grid">
            ${numberSetting("voice_speed", "Voice speed", settings.voice_speed, "0.65", "1.4", "0.01")}
            ${numberSetting("caption_words", "Caption words", settings.caption_words, "1", "8", "1")}
            ${numberSetting("image_count", "Visual variety", settings.image_count, "1", "24", "1")}
            ${numberSetting("music_volume", "Music volume", settings.music_volume, "0", "0.8", "0.01")}
            ${numberSetting("min_visual_segment_ms", "Min visual ms", settings.min_visual_segment_ms, "1200", "8000", "100")}
          </div>
        </div>`;
      }

      function scriptControls() {
        return `<div class="control-card"><h3>Script</h3>${instructionPresetRow([
          "Use a stronger first-line hook and keep the original subject.",
          "Make the story simpler, clearer, and less random.",
          "Add more suspense while preserving factual alignment.",
        ])}</div>`;
      }

      function researchControls(stageId) {
        const items = stageId === "topic_discovery_agent"
          ? ["Find a more specific angle for the same source prompt.", "Avoid broad generic topics.", "Prefer a stronger curiosity gap."]
          : ["Use more concrete details from sources.", "Keep only facts that support the narration.", "Remove weak or generic research beats."];
        return `<div class="control-card"><h3>${escapeHtml(label(stageId))}</h3>${instructionPresetRow(items)}</div>`;
      }

      function thumbnailControls() {
        return `<div class="control-card"><h3>Thumbnail</h3>${instructionPresetRow([
          "Use the clearest final-frame subject.",
          "Make the cover more readable at phone size.",
          "Use higher contrast while keeping the same video topic.",
        ])}</div>`;
      }

      function finalOutputControls() {
        return `<div class="control-card"><h3>Final Output</h3><p>Collect final artifacts again from the selected child run.</p></div>`;
      }

      function genericControls(stageId) {
        return `<div class="control-card"><h3>${escapeHtml(label(stageId))}</h3>${instructionPresetRow([
          "Preserve the original topic and rerun this stage cleanly.",
          "Keep upstream artifacts unchanged and rebuild downstream results.",
        ])}</div>`;
      }

      function numberSetting(key, title, value, min, max, step) {
        return `<label class="control-field">${escapeHtml(title)}
          <span class="control-line"><small>${escapeHtml(min)} - ${escapeHtml(max)}</small><span class="control-value" data-setting-output="${escapeHtml(key)}">${escapeHtml(settingDisplayValue(key, value))}</span></span>
          <input data-setting="${escapeHtml(key)}" type="range" min="${escapeHtml(min)}" max="${escapeHtml(max)}" step="${escapeHtml(step)}" value="${escapeHtml(value)}" />
        </label>`;
      }

      function selectSetting(key, title, options, value) {
        return `<label class="control-field">${escapeHtml(title)}
          <select data-setting="${escapeHtml(key)}">
            ${options.map(([optionValue, text]) => `<option value="${escapeHtml(optionValue)}" ${String(value) === String(optionValue) ? "selected" : ""}>${escapeHtml(text)}</option>`).join("")}
          </select>
        </label>`;
      }

      function presetRow(key, current, options) {
        return `<div class="control-row" data-preset-row="${escapeHtml(key)}">
          ${options.map(([value, text]) => `<button type="button" data-apply-setting="${escapeHtml(key)}" data-apply-value="${escapeHtml(value)}" class="${String(current) === String(value) ? "active" : ""}">${escapeHtml(text)}</button>`).join("")}
        </div>`;
      }

      function instructionPresetRow(items) {
        return `<div class="control-row">${items.map((item) => `<button type="button" data-add-instruction="${escapeHtml(item)}">${escapeHtml(shortInstruction(item))}</button>`).join("")}</div>`;
      }

      function instructionButtons(stageId) {
        const items = {
          render_agent: [
            "Keep the image motion smooth and centered.",
            "Avoid abrupt visual jumps between assets.",
          ],
          asset_agent: [
            "Avoid repeated or weak visual assets.",
            "Prefer visuals that match the named subject exactly.",
          ],
          caption_agent: [
            "Prioritize readable captions with safe margins.",
            "Keep phrases short and easy to scan.",
          ],
          audio_agent: [
            "Keep narration natural and not rushed.",
            "Preserve word timings for caption sync.",
          ],
          music_agent: [
            "Mix the selected music quietly under narration.",
            "Keep resolved SFX near their trigger words.",
          ],
        }[stageId] || [];
        return items.length ? instructionPresetRow(items) : "";
      }

      function defaultInstruction(stageId) {
        if (stageId === "render_agent") return "Apply the selected render animation, transition, and zoom settings.";
        if (stageId === "music_agent") return "Mix the selected uploaded music and resolved SFX under narration, or skip this node when no audio layers are selected.";
        if (stageId === "asset_agent") return "Keep upstream script and timing, but rebuild visuals with the selected asset options.";
        if (stageId === "audio_agent") return "Keep the same script and regenerate narration with the selected audio options.";
        if (stageId === "caption_agent") return "Keep the same narration and rebuild captions with the selected caption options.";
        return "";
      }

      function bindControlPanel(stage) {
        els.inspector.querySelectorAll("[data-apply-setting]").forEach((button) => {
          button.addEventListener("click", () => {
            const key = button.dataset.applySetting;
            const value = button.dataset.applyValue;
            const input = els.inspector.querySelector(`[data-setting="${cssEscape(key)}"]`);
            if (!input) return;
            if (input.type === "checkbox") {
              input.checked = value === "true" || value === "on" || value === "1";
            } else {
              input.value = value;
            }
            updateControlSettingsFromDom();
            updatePresetButtons();
          });
        });
        els.inspector.querySelectorAll("[data-add-instruction]").forEach((button) => {
          button.addEventListener("click", () => {
            const textarea = els.inspector.querySelector("[data-agent-instruction]");
            if (!textarea) return;
            const text = button.dataset.addInstruction || "";
            textarea.value = textarea.value.trim() ? `${textarea.value.trim()}\n${text}` : text;
            state.stageInstructions[stage.id] = textarea.value.trim();
          });
        });
        els.inspector.querySelectorAll("[data-setting]").forEach((input) => {
          input.addEventListener("input", () => {
            updateControlSettingsFromDom();
            updatePresetButtons();
          });
          input.addEventListener("change", () => {
            updateControlSettingsFromDom();
            updatePresetButtons();
          });
        });
        const note = els.inspector.querySelector("[data-agent-instruction]");
        if (note) {
          note.addEventListener("input", () => {
            state.stageInstructions[stage.id] = note.value.trim();
          });
        }
      }

      function updateControlSettingsFromDom() {
        const patch = {};
        els.inspector.querySelectorAll("[data-setting]").forEach((input) => {
          const key = input.dataset.setting;
          if (!key) return;
          if (input.type === "checkbox") patch[key] = input.checked;
          else if (input.type === "number" || input.type === "range") patch[key] = Number(input.value);
          else patch[key] = input.value;
        });
        state.controlSettings = { ...state.controlSettings, ...patch };
      }

      function updatePresetButtons() {
        els.inspector.querySelectorAll("[data-setting]").forEach((input) => {
          const key = input.dataset.setting;
          const output = els.inspector.querySelector(`[data-setting-output="${cssEscape(key)}"]`);
          if (output) output.textContent = settingDisplayValue(key, input.type === "checkbox" ? input.checked : input.value);
        });
        els.inspector.querySelectorAll("[data-preset-row]").forEach((row) => {
          const key = row.dataset.presetRow;
          const input = els.inspector.querySelector(`[data-setting="${cssEscape(key)}"]`);
          const value = input && input.type === "checkbox" ? String(input.checked) : String(input && input.value);
          const output = els.inspector.querySelector(`[data-setting-output="${cssEscape(key)}"]`);
          if (output && input) output.textContent = settingDisplayValue(key, input.type === "checkbox" ? input.checked : input.value);
          row.querySelectorAll("[data-apply-setting]").forEach((button) => {
            button.classList.toggle("active", String(button.dataset.applyValue) === value);
          });
        });
      }

      function payloadFromControls(stage) {
        updateControlSettingsFromDom();
        const settings = currentSettings();
        const note = els.inspector.querySelector("[data-agent-instruction]");
        const instruction = note && note.value ? note.value.trim() : "";
        const instructions = {};
        if (instruction) instructions[targetAgentForStage(stage.id)] = instruction;
        return {
          message: `Playground controls rerun: ${label(stage.agent_name || stage.id)}`,
          settings_patch: settings,
          music_path: selectedMusicPath(),
          forced_agent_instructions: instructions,
        };
      }

      function payloadForStageId(stageId) {
        const instruction = String(state.stageInstructions && state.stageInstructions[stageId] || "").trim();
        const instructions = {};
        if (instruction) instructions[targetAgentForStage(stageId)] = instruction;
        return {
          message: `Playground controls rerun: ${label(stageId)}`,
          settings_patch: currentSettings(),
          music_path: selectedMusicPath(),
          forced_agent_instructions: instructions,
        };
      }

      function targetAgentForStage(stageId) {
        if ([
          "topic_discovery_agent",
          "research_agent",
          "script_agent",
          "audio_agent",
          "caption_agent",
          "timed_visual_agent",
          "asset_agent",
          "music_agent",
          "render_agent",
          "thumbnail_agent",
          "validation_agent",
        ].includes(stageId)) return stageId;
        return "master_agent";
      }

      function currentSettings() {
        const run = state.currentRun || {};
        const settings = {
          voice_speed: 1,
          caption_words: 4,
          image_count: 8,
          music_volume: 0.12,
          music_path: "",
          visual_motion: true,
          transition_style: "slide",
          transition_seconds: 0.45,
          zoom_variant: "mixed",
          min_visual_segment_ms: 3500,
        };
        Object.assign(settings, run.settings || {});
        Object.assign(settings, run.settings_patch || {});
        const master = Array.isArray(run.stages) ? run.stages.find((stage) => stage.id === "master_agent") : null;
        if (master && master.output_json && master.output_json.settings) Object.assign(settings, master.output_json.settings);
        if (master && master.output_json && master.output_json.settings_patch) Object.assign(settings, master.output_json.settings_patch);
        Object.assign(settings, state.controlSettings || {});
        settings.visual_motion = settings.visual_motion !== false && settings.visual_motion !== "false" && settings.visual_motion !== "off";
        settings.voice_speed = cleanNumber(settings.voice_speed, 1);
        settings.caption_words = cleanNumber(settings.caption_words, 4);
        settings.image_count = cleanNumber(settings.image_count, 8);
        settings.music_volume = cleanNumber(settings.music_volume, 0.12);
        settings.transition_seconds = cleanNumber(settings.transition_seconds, 0.45);
        settings.min_visual_segment_ms = cleanNumber(settings.min_visual_segment_ms, 3500);
        settings.music_path = selectedMusicPath();
        settings.transition_style = ["slide", "fade", "wipe", "cut"].includes(settings.transition_style) ? settings.transition_style : "slide";
        settings.zoom_variant = ["mixed", "center_in", "center_out", "still"].includes(settings.zoom_variant) ? settings.zoom_variant : "mixed";
        return settings;
      }

      function settingsPreview(settings) {
        const bits = [
          `voice ${settings.voice_speed}`,
          `${settings.caption_words} words`,
          `${settings.image_count} visuals`,
          `music ${settings.music_volume}`,
          settings.music_path ? `track ${musicFileName(settings.music_path)}` : "no music",
          settings.visual_motion ? "motion on" : "motion off",
          `${settings.transition_style} ${settings.transition_seconds}s`,
          settings.zoom_variant.replaceAll("_", " "),
          `${settings.min_visual_segment_ms}ms beats`,
        ];
        return `<div class="settings-preview">${bits.map((bit) => `<span>${escapeHtml(bit)}</span>`).join("")}</div>`;
      }

      function selectedMusicPath() {
        if (state.musicPathOverride !== null && state.musicPathOverride !== undefined) {
          return String(state.musicPathOverride || "").trim();
        }
        const uploadPath = state.musicUpload && state.musicUpload.music_path;
        if (uploadPath) return String(uploadPath).trim();
        const controlPath = state.controlSettings && state.controlSettings.music_path;
        if (controlPath) return String(controlPath).trim();
        const run = state.currentRun || {};
        return String(
          run.music_path
          || (run.settings && run.settings.music_path)
          || (run.settings_patch && run.settings_patch.music_path)
          || ""
        ).trim();
      }

      function updateMusicStatus(message = "", isError = false) {
        if (!els.musicStatus) return;
        const musicPath = selectedMusicPath();
        els.musicStatus.textContent = message || (musicPath ? `Selected: ${musicFileName(musicPath)}` : "No music selected");
        els.musicStatus.classList.toggle("error", Boolean(isError));
        els.musicStatus.classList.toggle("selected", Boolean(musicPath) && !isError && !message);
      }

      function musicFileName(path) {
        const value = String(path || "").replaceAll("\\", "/");
        return value.split("/").filter(Boolean).pop() || "music";
      }

      function formatFileSize(bytes) {
        const value = Number(bytes) || 0;
        if (value < 1024) return `${value} B`;
        if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KB`;
        return `${(value / (1024 * 1024)).toFixed(1)} MB`;
      }

      function shortInstruction(text) {
        const clean = String(text || "").replace(/\.$/, "");
        return clean.length > 30 ? `${clean.slice(0, 27).trim()}...` : clean;
      }

      function cleanNumber(value, fallback) {
        const number = Number(value);
        return Number.isFinite(number) ? number : fallback;
      }

      function settingDisplayValue(key, value) {
        const number = Number(value);
        if (key === "voice_speed") return `${cleanNumber(value, 1).toFixed(2)}x`;
        if (key === "music_volume") return `${Math.round(cleanNumber(value, 0) * 100)}%`;
        if (key === "transition_seconds") return `${cleanNumber(value, 0).toFixed(2)}s`;
        if (key === "min_visual_segment_ms") return `${Math.round(cleanNumber(value, 0))}ms`;
        if (Number.isFinite(number)) return String(Math.round(number * 100) / 100);
        return String(value ?? "");
      }

      function stageInstruction(stageId) {
        if (state.stageInstructions && Object.prototype.hasOwnProperty.call(state.stageInstructions, stageId)) {
          return state.stageInstructions[stageId];
        }
        return defaultInstruction(stageId);
      }

      function cssEscape(value) {
        if (window.CSS && window.CSS.escape) return window.CSS.escape(value);
        return String(value || "").replace(/"/g, '\\"');
      }

      function openStageModal(tab = state.modalTab || "artifacts") {
        const stage = currentStage();
        if (!stage) return;
        state.modalTab = tab;
        els.stageModal.classList.add("open");
        els.stageModal.setAttribute("aria-hidden", "false");
        renderStageModal();
      }

      function closeStageModal() {
        els.stageModal.classList.remove("open");
        els.stageModal.setAttribute("aria-hidden", "true");
      }

      function renderStageModal() {
        const stage = currentStage();
        if (!stage) return;
        const tabs = [
          ["artifacts", `Artifacts (${(stage.artifacts || []).length})`],
          ["input", "Input"],
          ["output", "Output"],
          ["events", `Events (${(stage.events || []).length})`],
          ["prompt", "Prompt"],
          ...(stage.error_text ? [["error", "Error"]] : []),
        ];
        if (!tabs.some(([id]) => id === state.modalTab)) state.modalTab = "artifacts";
        els.modalTitle.textContent = label(stage.agent_name || stage.id);
        els.modalMeta.textContent = `${stage.status || "queued"} · ${stage.execution_mode || ""}`;
        els.modalTabs.innerHTML = tabs.map(([id, text]) => (
          `<button class="modal-tab ${id === state.modalTab ? "active" : ""}" data-tab="${id}" type="button">${escapeHtml(text)}</button>`
        )).join("");
        els.modalTabs.querySelectorAll("[data-tab]").forEach((button) => {
          button.addEventListener("click", () => {
            state.modalTab = button.dataset.tab;
            renderStageModal();
          });
        });
        els.modalBody.innerHTML = modalContent(stage, state.modalTab);
      }

      function modalContent(stage, tab) {
        if (tab === "artifacts") return `<div class="section">${artifactsGrid(stage.artifacts || [])}</div>`;
        if (tab === "input") return `<pre>${escapeHtml(pretty(stage.input_json) || "No input yet.")}</pre>`;
        if (tab === "output") return `<pre>${escapeHtml(pretty(stage.output_json) || "No output yet.")}</pre>`;
        if (tab === "events") return `<div class="section"><div class="event-list">${eventsBody(stage.events || [])}</div></div>`;
        if (tab === "prompt") return `<pre>${escapeHtml(stage.prompt_text || "No prompt for this stage.")}</pre>`;
        if (tab === "error") return `<pre>${escapeHtml(stage.error_text || "No error.")}</pre>`;
        return `<pre>No data.</pre>`;
      }

      function currentStage() {
        const run = state.currentRun;
        return state.selectedStage || (run && Array.isArray(run.stages)
          ? run.stages.find((item) => item.id === state.selectedStageId) || run.stages[0]
          : null);
      }

      function detailSection(title, content, open = true) {
        return `<details class="section" ${open ? "open" : ""}>
          <summary>${escapeHtml(title)}</summary>
          <pre>${escapeHtml(content || "No data yet.")}</pre>
        </details>`;
      }

      function eventsSection(events) {
        return `<details class="section" open><summary>Events</summary><div class="event-list">${eventsBody(events)}</div></details>`;
      }

      function eventsBody(events) {
        return events.length ? events.slice().reverse().map((event) => (
          `<div class="event">
            <strong>${escapeHtml(event.message || "Event")}</strong>
            <small>${formatTime(event.timestamp)} · ${escapeHtml(event.level || "info")}</small>
            <pre>${escapeHtml(pretty(event.payload_json || {}))}</pre>
          </div>`
        )).join("") : `<small>No events yet.</small>`;
      }

      function artifactsSection(artifacts) {
        return `<details class="section" open><summary>Artifacts</summary>${artifactsGrid(artifacts)}</details>`;
      }

      function artifactsGrid(artifacts) {
        const body = artifacts.length ? artifacts.map((artifact) => {
          const url = `${API}/artifacts/${encodeURIComponent(artifact.id)}`;
          const name = artifact.path ? artifact.path.split("/").pop() : artifact.kind;
          let preview = "";
          if (artifact.kind === "image") preview = `<img src="${url}" alt="${escapeHtml(name)}" loading="lazy" />`;
          if (artifact.kind === "video") preview = `<video src="${url}" controls></video>`;
          if (artifact.kind === "audio") preview = `<audio src="${url}" controls></audio>`;
          return `<div class="artifact">
            <strong>${escapeHtml(name || "Artifact")}</strong>
            ${preview}
            <a href="${url}" target="_blank" rel="noreferrer">Open file</a>
          </div>`;
        }).join("") : `<small>No artifacts yet.</small>`;
        return `<div class="artifact-grid">${body}</div>`;
      }

      function repeatIcon() {
        return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.76-4.24L13 11h8V3l-3.3 3.3Z"></path></svg>`;
      }

      async function api(path, options = {}) {
        const response = await fetch(`${API}${path}`, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        if (!response.ok) {
          let message = response.statusText;
          try {
            const data = await response.json();
            message = data.detail || message;
          } catch (_error) {}
          throw new Error(message);
        }
        return response.json();
      }

      function compactChatHistory() {
        return state.messages
          .filter((message) => !message.pending)
          .slice(-12)
          .map((message) => ({
            role: message.role,
            content: String(message.content || "").slice(0, 500),
          }));
      }

      function summaryForRun(run) {
        const stages = Array.isArray(run.stages) ? run.stages : [];
        const active = [...stages].reverse().find((stage) => stage.status === "running")
          || stages.find((stage) => stage.status === "failed")
          || stages.find((stage) => stage.status === "queued")
          || stages[stages.length - 1];
        const activeName = label(active && active.agent_name || "Agent");
        if (run.status === "succeeded") {
          return "Done. I finished the video run and collected the final output, thumbnails, logs, and artifacts. You can click any agent node to inspect exactly what happened.";
        }
        if (run.status === "failed") {
          return `I hit a problem while ${activeName} was working. I saved the available inputs, logs, and partial artifacts so you can open that node and inspect what went wrong.`;
        }
        if (active && active.id === "asset_agent") {
          return "I am searching and ranking visuals now. I am checking the available sources, avoiding repeats, and keeping the best matched assets for the timeline.";
        }
        if (active && active.id === "script_agent") {
          return "I am writing and validating the script now. I am keeping it aligned with your prompt and the selected genre.";
        }
        if (active && active.id === "validation_agent") {
          return "I am checking the latest agent output now. If it fails, I will send the validator notes back to the responsible agent and show the loop in the graph.";
        }
        if (active && active.id === "audio_agent") {
          return "I am generating the narration audio and timing data now, so captions and visuals can stay in sync.";
        }
        if (active && active.id === "music_agent") {
          return "I am preparing the music and SFX layer now. If no audio layers are selected, I will keep the clean narration audio and move on.";
        }
        if (active && active.id === "render_agent") {
          return "I am rendering the final video now. This can take a little while because audio, captions, visuals, and timing are being assembled together.";
        }
        return `I am working through ${activeName} now. The graph is updating as each agent finishes, and you can click any node for full details.`;
      }

      function friendlyError(error) {
        const text = error && error.message ? error.message : String(error || "Unknown error");
        return `I could not start that run yet. The backend said: ${text}`;
      }

      function pretty(value) {
        if (value === null || value === undefined || value === "") return "";
        if (typeof value === "string") return value;
        return JSON.stringify(value, null, 2);
      }

      function label(value) {
        return String(value || "")
          .replaceAll("_", " ")
          .replace(/\b\w/g, (char) => char.toUpperCase());
      }

      function formatTime(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return date.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
