services:
  db_app:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${APP_DB_USER:-pradeep}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-password}
      POSTGRES_DB: ${APP_DB_NAME:-automation}
    ports:
      - "${APP_DB_PORT:-5432}:5432"
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-pradeep} -d ${APP_DB_NAME:-automation}"]
      interval: 5s
      timeout: 5s
      retries: 20

  db_playground:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PLAYGROUND_DB_USER:-playground}
      POSTGRES_PASSWORD: ${PLAYGROUND_DB_PASSWORD:-playground}
      POSTGRES_DB: ${PLAYGROUND_DB_NAME:-playground}
    ports:
      - "${PLAYGROUND_DB_PORT:-5433}:5432"
    volumes:
      - playground_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLAYGROUND_DB_USER:-playground} -d ${PLAYGROUND_DB_NAME:-playground}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-pradeep}:${APP_DB_PASSWORD:-password}@db_app:5432/${APP_DB_NAME:-automation}
      REDIS_URL: redis://redis:6379/0
      MODULARSHORTS_DATA_DIR: /app/data/pipeline
      MODULARSHORTS_RUNS_DIR: /app/data/pipeline/runs
      PLAYGROUND_PIPELINE_DATA_DIR: /app/playground/data/pipeline
      PLAYGROUND_RUNS_DIR: /app/playground/data/runs
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8084}
      GOOGLE_TTS_CREDENTIALS: ${GOOGLE_TTS_CREDENTIALS:-/app/secrets/google-tts.json}
    ports:
      - "${APP_PORT:-8084}:8080"
    volumes:
      - ./backend/data:/app/data
      - ./playground/data:/app/playground/data
      - ./secrets:/app/secrets:ro
    depends_on:
      db_app:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-pradeep}:${APP_DB_PASSWORD:-password}@db_app:5432/${APP_DB_NAME:-automation}
      REDIS_URL: redis://redis:6379/0
      MODULARSHORTS_DATA_DIR: /app/data/pipeline
      MODULARSHORTS_RUNS_DIR: /app/data/pipeline/runs
      GOOGLE_TTS_CREDENTIALS: ${GOOGLE_TTS_CREDENTIALS:-/app/secrets/google-tts.json}
    volumes:
      - ./backend/data:/app/data
      - ./secrets:/app/secrets:ro
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

  adminer:
    image: adminer:4
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    depends_on:
      db_app:
        condition: service_healthy
      db_playground:
        condition: service_healthy

volumes:
  app_postgres_data:
  playground_postgres_data:
